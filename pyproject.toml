[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "road-irregularity-ml"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
]

[project.scripts]
train-dummy = "src.legacy.scripts.train_dummy:main"
generate-mock-data = "src.legacy.scripts.generate_mock_data:main"
extract-features = "src.legacy.scripts.extract_features:main"
build-wheelchair-dataset = "src.legacy.scripts.build_wheelchair_dataset:main"
train-wheelchair-model = "src.legacy.scripts.train_wheelchair_model:main"
plot-raw-acc = "src.tools.plot_raw_acc:main"
transform-world-frame = "src.tools.transform_world_frame:main"
plot-world-frame = "src.tools.plot_world_frame:main"
plot-world-z = "src.tools.plot_world_z:main"
plot-world-z-crops = "src.legacy.scripts.plot_world_z_crops:main"
analyze-flat-event = "src.legacy.scripts.analyze_flat_event:main"
analyze-jerk-event = "src.legacy.scripts.analyze_jerk_event:main"
analyze-class-balance = "src.legacy.scripts.analyze_class_balance:main"
analyze-multi-feature-balance = "src.legacy.scripts.analyze_multi_feature_balance:main"
analyze-feature-importance = "src.legacy.scripts.analyze_feature_importance:main"
analyze-magnitude-event = "src.legacy.scripts.analyze_magnitude_event:main"
analyze-magnitude-feature-balance = "src.legacy.scripts.analyze_magnitude_feature_balance:main"
analyze-magnitude-feature-importance = "src.legacy.scripts.analyze_magnitude_feature_importance:main"

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
